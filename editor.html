<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講義計画・授業内容 編集ツール</title>
<style>
  :root{
    --paper: #F5F8FB;
    --paper-raised: #FFFFFF;
    --ink: #23272B;
    --ink-soft: #5B6169;
    --line: #D6E2EA;
    --accent: #2F6F9A;
    --accent-soft: #E7F1F8;
    --danger: #B0555A;
    --danger-soft: #F6EAEA;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.6;
  }
  .topbar{
    position: sticky; top: 0; z-index: 10;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }
  .topbar-inner{
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .topbar h1{ font-size: 16px; margin: 0; flex: 1 1 auto; min-width: 0; }
  .btn{
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    display: inline-block; text-decoration: none;
  }
  .btn:hover{ border-color: var(--accent); background: var(--accent-soft); }
  .btn.primary{ background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover{ opacity: .9; }
  input[type=file]{ display:none; }

  .save-status{ font-size: 11px; color: var(--ink-soft); flex: 0 0 auto; }

  @media (max-width: 560px){
    .topbar{ padding: 10px 14px; }
    .topbar-inner{ gap: 8px; }
    .topbar h1{ flex: 1 1 100%; font-size: 14px; }
    .save-status{ flex: 1 1 100%; font-size: 10.5px; }
    .btn{ font-size: 11.5px; padding: 6px 9px; }
    .tabs{ padding: 0 14px; flex-wrap: wrap; }
    .tab-btn{ flex: 1 1 calc(50% - 4px); font-size: 12px; }
    .wrap{ padding: 14px; }
  }

  .tabs{
    max-width: 900px; margin: 14px auto 0; padding: 0 20px;
    display: flex; gap: 8px;
  }
  .tab-btn{
    flex: 1 1 0; font: inherit; font-size: 13px; font-weight: 700;
    padding: 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
  }
  .tab-btn.active{ border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 20px; }
  .view{ display: none; }
  .view.active{ display: block; }

  .note-box{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 20px; font-size: 12.5px; color: var(--ink-soft);
  }
  .note-box strong{ color: var(--ink); }
  .note-box code{ background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; }

  .session-card{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .session-card-head{ display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .session-card-head .session-num-badge{
    font-size: 14px; padding: 5px 10px;
  }
  .session-card-head select.topic-select{
    font-size: 16px; font-weight: 700; color: var(--ink);
    padding: 8px 10px; min-width: 0; flex: 1 1 140px;
  }
  .session-num-badge{
    font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px;
    flex: 0 0 auto; white-space: nowrap;
  }
  .field-row{ display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .field-row:last-child{ margin-bottom: 0; }
  .field-row label{ font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .field-row input[type=text], .field-row select{
    font: inherit; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--paper);
    color: var(--ink); width: 100%;
  }
  textarea.autogrow{
    font: inherit; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--paper);
    color: var(--ink); width: 100%; resize: none; overflow: hidden;
    min-height: 38px;
  }
  select.topic-select{
    flex: 1 1 auto; font: inherit; font-size: 13.5px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--paper-raised); color: var(--ink);
  }

  .topic-group{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .topic-group-title{ font-size: 14px; font-weight: 700; margin-bottom: 10px; }

  .item-row{
    display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
  }
  .item-row.drag-over{ border-color: var(--accent); background: var(--accent-soft); }
  .item-row.dragging{ opacity: .4; }
  .drag-handle{
    flex: 0 0 auto; width: 20px; height: 32px; display:flex; align-items:center; justify-content:center;
    cursor: grab; color: var(--ink-soft); font-size: 14px; user-select: none; touch-action: none;
  }
  .drag-handle:active{ cursor: grabbing; }
  .item-row input[type=text]{
    flex: 1 1 auto; font: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink);
  }
  .item-row textarea{
    flex: 1 1 auto; font: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink);
    resize: none; overflow: hidden; min-height: 32px;
  }
  .icon-btn{
    flex: 0 0 auto; width: 28px; height: 32px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--danger);
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  .icon-btn:hover{ border-color: var(--danger); background: var(--danger-soft); }
  .add-row-btn{
    font: inherit; font-size: 12px; font-weight: 600; color: var(--accent);
    background: none; border: 1px dashed var(--accent); border-radius: 7px;
    padding: 6px 10px; cursor: pointer; margin-top: 4px;
  }
  .add-row-btn:hover{ background: var(--accent-soft); }

  details.notes-details{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 20px;
  }
  details.notes-details summary{ font-size: 13px; font-weight: 700; cursor: pointer; }
  .preview-details{ background: var(--accent-soft); border-color: var(--accent); }
  .preview-box{
    width: 100%; margin-top: 10px; padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 12.5px; line-height: 1.7; white-space: pre;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper-raised); color: var(--ink);
    resize: vertical;
  }
  .topic-note-row{ margin-top: 12px; }
  .topic-note-row label{ font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; }
  .topic-note-row textarea{ min-height: 60px; }

  /* ---------- ③ 授業内容:2段階アコーディオン ---------- */
  .lecture-card{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
  }
  .lecture-head{
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    flex-wrap: wrap;
  }
  .lecture-head .session-num-badge{
    font-size: 14px; padding: 5px 10px;
  }
  .lecture-head select.topic-select{
    font-size: 16px; font-weight: 700; color: var(--ink);
    padding: 8px 10px; border-color: var(--line);
    min-width: 0; flex: 1 1 140px;
  }
  .lecture-toggle{
    flex: 0 0 auto; height: 34px; padding: 0 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    cursor: pointer; font-size: 12px; white-space: nowrap; margin-left: auto;
  }
  .lecture-toggle:hover{ border-color: var(--accent); }
  .lecture-body{ display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .lecture-card.open .lecture-body{ display: block; }
  .lecture-card.open .lecture-toggle{ color: var(--accent); border-color: var(--accent); }

  .group-block{
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 8px; overflow: hidden;
  }
  .group-block.drag-over{ border-color: var(--accent); }
  .group-block.dragging{ opacity: .4; }
  .group-head{ display: flex; align-items: center; gap: 6px; padding: 6px; }
  .group-head input[type=text]{
    flex: 1 1 auto; font: inherit; font-size: 13px; font-weight: 700; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink);
  }
  .group-count{
    flex: 0 0 auto; font-size: 10.5px; color: var(--ink-soft);
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
    white-space: nowrap;
  }
  .group-toggle{
    flex: 0 0 auto; width: 26px; height: 30px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
    cursor: pointer; font-size: 11px;
  }
  .group-toggle:hover{ border-color: var(--accent); }
  .group-body{ display: none; padding: 0 8px 8px 30px; }
  .group-block.open .group-body{ display: block; }
  .group-block.open .group-toggle{ color: var(--accent); border-color: var(--accent); }
  .child-row{
    display: flex; align-items: flex-start; gap: 6px; margin-top: 6px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 7px; padding: 6px;
  }
  .child-row.drag-over{ border-color: var(--accent); background: var(--accent-soft); }
  .child-row.dragging{ opacity: .4; }
  .child-row textarea{
    flex: 1 1 auto; font: inherit; font-size: 12.5px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
    resize: none; overflow: hidden; min-height: 30px;
  }
  .add-child-btn{
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--accent);
    background: none; border: 1px dashed var(--accent); border-radius: 6px;
    padding: 5px 9px; cursor: pointer; margin-top: 6px;
  }
  .add-child-btn:hover{ background: var(--accent-soft); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="btn" href="index.html">← 講義計画に戻る</a>
    <h1>講義計画・授業内容 編集ツール</h1>
    <span class="save-status" id="saveStatus"></span>
    <button class="btn" id="resetBtn">設定をリセット</button>
    <button class="btn" id="importBtn">JSON読み込み</button>
    <input type="file" id="importFile" accept="application/json">
    <button class="btn primary" id="exportBtn">JSON書き出し</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-view="view-sessions">① 講義計画(15コマ)</button>
  <button class="tab-btn" data-view="view-checklists">② 理解度チェック</button>
  <button class="tab-btn" data-view="view-outline">③ 授業内容(講義1-15)</button>
  <button class="tab-btn" data-view="view-topics">④ 疾患一覧</button>
</div>

<div class="wrap">

  <div class="view active" id="view-sessions">
    <div id="sessionsList"></div>
  </div>

  <div class="view" id="view-checklists">
    <div id="checklistsList"></div>
  </div>

  <div class="view" id="view-outline">
    <details class="notes-details preview-details" open>
      <summary>全体を文章で確認(編集内容が自動的に反映されます)</summary>
      <textarea id="outlinePreviewBox" class="preview-box" readonly rows="12"></textarea>
    </details>
    <div id="outlineList"></div>
    <details class="notes-details">
      <summary>疾患ごとの共通メモ(POINTなど・任意)</summary>
      <div id="topicNotesList"></div>
    </details>
  </div>

  <div class="view" id="view-topics">
    <div class="note-box">
      疾患・項目の名称はここで自由に変更できます。「+ 疾患を追加」で新しい項目を増やせます。削除は、①③でその疾患が使われていない場合のみ可能です(使われている場合は、先に他の疾患へ変更してから削除してください)。
    </div>
    <div id="topicsList"></div>
    <button class="add-row-btn" id="addTopicBtn">+ 疾患を追加</button>
  </div>

</div>

    ],
    "review": [
      "項目A(仮・内容は決まり次第差し替え)",
      "項目B(仮・内容は決まり次第差し替え)",
      "項目C(仮・内容は決まり次第差し替え)"
    ],
    "topic-msv2xol5": [],
    "topic-msv4lp8u": [
      "寝返動作",

  },
  "topicNotes": {
    "parkinson": "パーキンソン病の病理を理解することで、多彩な症状を「暗記」するのではなく理解してイメージできるようになる(特にパーキンソン病パンデミックといわれるほど今後増加することが予想されており、遭遇する頻度も高いためここをおさえておくことは非常に重要)\n\n大脳基底核の機能を理解することで脳血管疾患に対する理解も深めることができる\n鑑別のための脳画像の評価も他の疾患の理解につながる\n理学療法介入が実際にできることまで目指す(特に起居動作の評価・治療(体位変換の介助方法も含めて)、起立動作、歩行介入の部分は実践できることを目指す)",
    "scd_msa": "複雑な名称にまどわされず、まず分類を整理すること\n\n「診断」するわけではないので、どのような症状が出るのかを理解し、それに対するリハビリの評価・方針を考えられることが重要\nMSA-Pについては、Parkinson病との違いを理解することで、Parkinson病の理解も深められる\nシャイドレーガー症候群については、自律神経症状(起立性低血圧)への対応も理解するきっかけとする",
    "topic-msv2xol5": "",
    "topic-msv4lp8u": ""
  }
};
  var STORAGE_KEY = 'neuro-pt-editor-draft-v3';

  function migrateLectureItems(items){
    // v2互換: フラットな{type,text}配列を{text,children}構造に変換
    if(!items || items.length === 0) return [];
    if(items[0] && items[0].hasOwnProperty('children')) return items;
    var groups = [];
    items.forEach(function(it){
      if(it.type === 'sub'){
        if(groups.length === 0){ groups.push({text: '(見出しなし)', children: []}); }
        groups[groups.length - 1].children.push(it.text);
      } else {
        groups.push({text: it.text, children: []});
      }
    });
    return groups;
  }

  function migrateState(data){
    if(data && data.lectures){
      data.lectures.forEach(function(lec){
        lec.items = migrateLectureItems(lec.items);
      });
    }
    return data;
  }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return migrateState(JSON.parse(raw));
    } catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  function makeId(prefix){
    return prefix + '-' + Math.random().toString(36).slice(2, 9);
  }

  function ensureGroupIds(data){
    if(data && data.lectures){
      data.lectures.forEach(function(lec){
        (lec.items || []).forEach(function(group){
          if(!group.id){ group.id = makeId('grp'); }
        });
      });
    }
    return data;
  }

  var state = ensureGroupIds(loadState());
  var saveTimer = null;

  // アコーディオンの開閉状態(再描画をまたいで保持する。ページ再読み込みでは初期化される)
  var openLectures = {};   // { lectureNum: true }
  var openGroups = {};     // { groupId: true }

  function persist(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      var el = document.getElementById('saveStatus');
      el.textContent = '保存済み ' + new Date().toLocaleTimeString('ja-JP');
    } catch(e){}
  }
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function topicOptions(selectedId){
    return state.topics.map(function(t){
      return '<option value="' + t.id + '"' + (t.id === selectedId ? ' selected' : '') + '>' + t.name + '</option>';
    }).join('');
  }
  function topicName(id){
    var t = state.topics.filter(function(x){ return x.id === id; })[0];
    return t ? t.name : id;
  }

  function escapeAttr(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  /* ---------- 汎用ドラッグ並び替え ---------- */
  function enableDragReorder(container, array, itemSelector, onChange){
    var dragIndex = null;
    container.querySelectorAll(itemSelector).forEach(function(row){
      row.addEventListener('dragstart', function(ev){
        ev.stopPropagation();
        dragIndex = parseInt(row.dataset.index, 10);
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', function(ev){
        ev.stopPropagation();
        row.classList.remove('dragging');
        container.querySelectorAll(itemSelector).forEach(function(r){ r.classList.remove('drag-over'); });
      });
      row.addEventListener('dragover', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', function(ev){
        ev.stopPropagation();
        row.classList.remove('drag-over');
      });
      row.addEventListener('drop', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        row.classList.remove('drag-over');
        var dropIndex = parseInt(row.dataset.index, 10);
        if(dragIndex === null || dragIndex === dropIndex) return;
        var moved = array.splice(dragIndex, 1)[0];
        array.splice(dropIndex, 0, moved);
        dragIndex = null;
        onChange();
      });
    });
  }

  /* ---------- ① 講義計画 ---------- */
  function renderSessions(){
    var container = document.getElementById('sessionsList');
    container.innerHTML = '';
    state.lectures.forEach(function(lec){
      var card = document.createElement('div');
      card.className = 'session-card';
      card.innerHTML =
        '<div class="session-card-head">' +
          '<span class="session-num-badge">第' + parseInt(lec.num,10) + '回</span>' +
          '<select class="topic-select" data-field="topicId">' + topicOptions(lec.topicId) + '</select>' +
        '</div>' +
        '<div class="field-row"><label>講義名</label>' +
          '<input type="text" data-field="theme" value="' + escapeAttr(lec.theme) + '">' +
        '</div>' +
        '<div class="field-row"><label>内容</label>' +
          '<textarea class="autogrow" data-field="desc" rows="1">' + escapeHtml(lec.desc) + '</textarea>' +
        '</div>';

      card.querySelector('[data-field="topicId"]').addEventListener('change', function(e){
        lec.topicId = e.target.value;
        scheduleSave();
        renderOutline();
      });
      card.querySelector('[data-field="theme"]').addEventListener('input', function(e){
        lec.theme = e.target.value;
        scheduleSave();
      });
      var descEl = card.querySelector('[data-field="desc"]');
      descEl.addEventListener('input', function(e){
        lec.desc = e.target.value;
        autoGrow(e.target);
        scheduleSave();
      });

      container.appendChild(card);
      autoGrow(descEl);
    });
  }

  /* ---------- ② 理解度チェック ---------- */
  function renderChecklists(){
    var container = document.getElementById('checklistsList');
    container.innerHTML = '';
    state.topics.forEach(function(t){
      var group = document.createElement('div');
      group.className = 'topic-group';
      var list = state.checklists[t.id] || (state.checklists[t.id] = []);

      var itemsWrap = document.createElement('div');
      itemsWrap.className = 'items-wrap';

      list.forEach(function(text, i){
        var row = document.createElement('div');
        row.className = 'item-row';
        row.draggable = true;
        row.dataset.index = i;
        row.innerHTML =
          '<span class="drag-handle">::</span>' +
          '<textarea rows="1">' + escapeHtml(text) + '</textarea>' +
          '<button class="icon-btn" data-action="del">×</button>';
        var ta = row.querySelector('textarea');
        ta.addEventListener('input', function(e){
          list[i] = e.target.value;
          autoGrow(e.target);
          scheduleSave();
        });
        row.querySelector('[data-action="del"]').addEventListener('click', function(){
          if(!confirm('この項目を削除しますか?\n「' + text + '」')) return;
          list.splice(i, 1);
          scheduleSave();
          renderChecklists();
        });
        itemsWrap.appendChild(row);
      });

      group.innerHTML = '<div class="topic-group-title">' + t.name + '</div>';
      group.appendChild(itemsWrap);
      var addBtn = document.createElement('button');
      addBtn.className = 'add-row-btn';
      addBtn.textContent = '+ 項目を追加';
      addBtn.addEventListener('click', function(){
        list.push('新しい項目');
        scheduleSave();
        renderChecklists();
      });
      group.appendChild(addBtn);
      container.appendChild(group);

      itemsWrap.querySelectorAll('textarea').forEach(autoGrow);
      enableDragReorder(itemsWrap, list, '.item-row', function(){ scheduleSave(); renderChecklists(); });
    });
  }

  /* ---------- 疾患共通メモ ---------- */
  function renderTopicNotes(){
    var container = document.getElementById('topicNotesList');
    container.innerHTML = '';
    state.topics.forEach(function(t){
      var row = document.createElement('div');
      row.className = 'topic-note-row';
      row.innerHTML =
        '<label>' + t.name + '</label>' +
        '<textarea class="autogrow" rows="3" placeholder="疾患共通のポイントなど(1行1項目)">' + escapeHtml(state.topicNotes[t.id] || '') + '</textarea>';
      var ta = row.querySelector('textarea');
      ta.addEventListener('input', function(e){
        state.topicNotes[t.id] = e.target.value;
        autoGrow(e.target);
        scheduleSave();
      });
      container.appendChild(row);
      autoGrow(ta);
    });
  }

  /* ---------- ③ 授業内容(2段階アコーディオン) ---------- */
  function renderOutline(){
    var container = document.getElementById('outlineList');
    container.innerHTML = '';

    state.lectures.forEach(function(lec){
      var card = document.createElement('div');
      card.className = 'lecture-card' + (openLectures[lec.num] ? ' open' : '');

      var head = document.createElement('div');
      head.className = 'lecture-head';
      head.innerHTML =
        '<span class="session-num-badge">第' + parseInt(lec.num,10) + '回</span>' +
        '<select class="topic-select" data-field="topicId">' + topicOptions(lec.topicId) + '</select>' +
        '<button type="button" class="lecture-toggle">▾ 編集</button>';
      head.querySelector('[data-field="topicId"]').addEventListener('change', function(e){
        lec.topicId = e.target.value;
        scheduleSave();
        renderSessions();
        renderOutlinePreview();
      });
      head.querySelector('.lecture-toggle').addEventListener('click', function(){
        card.classList.toggle('open');
        if(card.classList.contains('open')){ openLectures[lec.num] = true; } else { delete openLectures[lec.num]; }
      });
      card.appendChild(head);

      var body = document.createElement('div');
      body.className = 'lecture-body';

      var groupsWrap = document.createElement('div');
      groupsWrap.className = 'groups-wrap';

      lec.items.forEach(function(group, gi){
        var gBlock = document.createElement('div');
        gBlock.className = 'group-block' + (openGroups[group.id] ? ' open' : '');
        gBlock.draggable = true;
        gBlock.dataset.index = gi;

        var gHead = document.createElement('div');
        gHead.className = 'group-head';
        gHead.innerHTML =
          '<span class="drag-handle">::</span>' +
          '<input type="text" value="' + escapeAttr(group.text) + '" placeholder="項目名">' +
          '<span class="group-count">' + group.children.length + '件</span>' +
          '<button type="button" class="group-toggle">▾</button>' +
          '<button class="icon-btn" data-action="del-group">×</button>';

        gHead.querySelector('input[type=text]').addEventListener('input', function(e){
          group.text = e.target.value;
          scheduleSave();
          renderOutlinePreview();
        });
        gHead.querySelector('.group-toggle').addEventListener('click', function(){
          gBlock.classList.toggle('open');
          if(gBlock.classList.contains('open')){ openGroups[group.id] = true; } else { delete openGroups[group.id]; }
        });
        gHead.querySelector('[data-action="del-group"]').addEventListener('click', function(){
          var msg = group.children.length > 0
            ? 'この項目と、その下の内容' + group.children.length + '件をまとめて削除しますか?\n「' + group.text + '」'
            : 'この項目を削除しますか?\n「' + group.text + '」';
          if(!confirm(msg)) return;
          delete openGroups[group.id];
          lec.items.splice(gi, 1);
          scheduleSave();
          renderOutline();
        });

        gBlock.appendChild(gHead);

        var gBody = document.createElement('div');
        gBody.className = 'group-body';

        var childrenWrap = document.createElement('div');
        childrenWrap.className = 'children-wrap';

        group.children.forEach(function(childText, ci){
          var cRow = document.createElement('div');
          cRow.className = 'child-row';
          cRow.draggable = true;
          cRow.dataset.index = ci;
          cRow.innerHTML =
            '<span class="drag-handle">::</span>' +
            '<textarea rows="1" placeholder="内容">' + escapeHtml(childText) + '</textarea>' +
            '<button class="icon-btn" data-action="del-child">×</button>';

          var cta = cRow.querySelector('textarea');
          cta.addEventListener('input', function(e){
            group.children[ci] = e.target.value;
            autoGrow(e.target);
            scheduleSave();
            renderOutlinePreview();
          });
          cRow.querySelector('[data-action="del-child"]').addEventListener('click', function(){
            if(!confirm('この内容を削除しますか?\n「' + childText + '」')) return;
            group.children.splice(ci, 1);
            scheduleSave();
            renderOutline();
          });
          childrenWrap.appendChild(cRow);
        });

        gBody.appendChild(childrenWrap);

        var addChildBtn = document.createElement('button');
        addChildBtn.type = 'button';
        addChildBtn.className = 'add-child-btn';
        addChildBtn.textContent = '+ 内容を追加';
        addChildBtn.addEventListener('click', function(){
          group.children.push('新しい内容');
          openLectures[lec.num] = true;
          openGroups[group.id] = true;
          scheduleSave();
          renderOutline();
        });
        gBody.appendChild(addChildBtn);

        gBlock.appendChild(gBody);
        groupsWrap.appendChild(gBlock);

        childrenWrap.querySelectorAll('textarea').forEach(autoGrow);
        enableDragReorder(childrenWrap, group.children, '.child-row', function(){ scheduleSave(); renderOutline(); });
      });

      body.appendChild(groupsWrap);

      var addGroupBtn = document.createElement('button');
      addGroupBtn.type = 'button';
      addGroupBtn.className = 'add-row-btn';
      addGroupBtn.textContent = '+ 項目を追加';
      addGroupBtn.addEventListener('click', function(){
        var newGroup = {id: makeId('grp'), text: '新しい項目', children: []};
        lec.items.push(newGroup);
        openLectures[lec.num] = true;
        openGroups[newGroup.id] = true;
        scheduleSave();
        renderOutline();
      });
      body.appendChild(addGroupBtn);

      card.appendChild(body);
      container.appendChild(card);

      enableDragReorder(groupsWrap, lec.items, '.group-block', function(){ scheduleSave(); renderOutline(); });
    });

    renderOutlinePreview();
  }

  function buildOutlineText(){
    var lines = [];
    state.lectures.forEach(function(lec){
      lines.push('■ 第' + parseInt(lec.num,10) + '回　' + topicName(lec.topicId));
      if(lec.items.length === 0){
        lines.push('  (項目なし)');
      }
      lec.items.forEach(function(group){
        lines.push('　・' + group.text);
        group.children.forEach(function(child){
          lines.push('　　- ' + child);
        });
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  function renderOutlinePreview(){
    var box = document.getElementById('outlinePreviewBox');
    if(!box) return;
    box.value = buildOutlineText();
  }

  /* ---------- ④ 疾患一覧 ---------- */
  function slugify(){
    return 'topic-' + Date.now().toString(36);
  }

  function renderTopics(){
    var container = document.getElementById('topicsList');
    container.innerHTML = '';

    state.topics.forEach(function(t, i){
      var row = document.createElement('div');
      row.className = 'item-row';
      row.draggable = true;
      row.dataset.index = i;
      row.innerHTML =
        '<span class="drag-handle">::</span>' +
        '<input type="text" value="' + escapeAttr(t.name) + '">' +
        '<button class="icon-btn" data-action="del">×</button>';

      row.querySelector('input').addEventListener('input', function(e){
        t.name = e.target.value;
        scheduleSave();
        renderSessions();
        renderChecklists();
        renderOutline();
        renderTopicNotes();
      });

      row.querySelector('[data-action="del"]').addEventListener('click', function(){
        var usedIn = state.lectures.filter(function(lec){ return lec.topicId === t.id; })
          .map(function(lec){ return '第' + parseInt(lec.num,10) + '回'; });
        if(usedIn.length > 0){
          alert('「' + t.name + '」は' + usedIn.join('、') + 'で使われているため削除できません。先に別の疾患へ変更してください。');
          return;
        }
        if(!confirm('「' + t.name + '」を削除しますか?')) return;
        state.topics.splice(i, 1);
        delete state.checklists[t.id];
        delete state.topicNotes[t.id];
        scheduleSave();
        renderAll();
      });

      container.appendChild(row);
    });

    enableDragReorder(container, state.topics, '.item-row', function(){
      scheduleSave();
      renderAll();
    });
  }

  document.getElementById('addTopicBtn').addEventListener('click', function(){
    var id = slugify();
    state.topics.push({id: id, name: '新しい疾患'});
    state.checklists[id] = [];
    state.topicNotes[id] = '';
    scheduleSave();
    renderTopics();
    renderTopicNotes();
  });

  function renderAll(){
    renderSessions();
    renderChecklists();
    renderTopicNotes();
    renderOutline();
    renderTopics();
  }
  renderAll();

  /* ---------- Tabs ---------- */
  document.querySelectorAll('.tab-btn').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.view).classList.add('active');
    });
  });

  /* ---------- Export / Import / Reset ---------- */
  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob(['\ufeff' + JSON.stringify(state, null, 2)], {type: 'application/json;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'neuro-pt-content-' + ts + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var text = reader.result.replace(/^\ufeff/, '');
        var parsed = migrateState(JSON.parse(text));
        state = parsed;
        persist();
        renderAll();
        alert('読み込みました。');
      } catch(err){
        alert('JSONの読み込みに失敗しました。ファイルを確認してください。');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('現在の編集内容を破棄して、サイトの現在の内容に戻します。よろしいですか?')) return;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    persist();
    renderAll();
  });

  persist();
</script>
