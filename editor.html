<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講義計画・授業内容 編集ツール</title>
<style>
  :root{
    --paper: #F5F8FB;
    --paper-raised: #FFFFFF;
    --ink: #23272B;
    --ink-soft: #5B6169;
    --line: #D6E2EA;
    --accent: #2F6F9A;
    --accent-soft: #E7F1F8;
    --danger: #B0555A;
    --danger-soft: #F6EAEA;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.6;
  }
  .topbar{
    position: sticky; top: 0; z-index: 10;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }
  .topbar-inner{
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .topbar h1{ font-size: 16px; margin: 0; flex: 1 1 auto; min-width: 0; }
  .btn{
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    display: inline-block; text-decoration: none;
  }
  .btn:hover{ border-color: var(--accent); background: var(--accent-soft); }
  .btn.primary{ background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover{ opacity: .9; }
  input[type=file]{ display:none; }

  .save-status{ font-size: 11px; color: var(--ink-soft); flex: 0 0 auto; }

  @media (max-width: 560px){
    .topbar{ padding: 10px 14px; }
    .topbar-inner{ gap: 8px; }
    .topbar h1{ flex: 1 1 100%; font-size: 14px; }
    .save-status{ flex: 1 1 100%; font-size: 10.5px; }
    .btn{ font-size: 11.5px; padding: 6px 9px; }
    .tabs{ padding: 0 14px; flex-wrap: wrap; }
    .tab-btn{ flex: 1 1 calc(50% - 4px); font-size: 12px; }
    .wrap{ padding: 14px; }
  }

  .tabs{
    max-width: 900px; margin: 14px auto 0; padding: 0 20px;
    display: flex; gap: 8px;
  }
  .tab-btn{
    flex: 1 1 0; font: inherit; font-size: 13px; font-weight: 700;
    padding: 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
  }
  .tab-btn.active{ border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 20px; }
  .view{ display: none; }
  .view.active{ display: block; }

  .note-box{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 20px; font-size: 12.5px; color: var(--ink-soft);
  }
  .note-box strong{ color: var(--ink); }
  .note-box code{ background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; }

  .session-card{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .session-card-head{ display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .session-card-head .session-num-badge{
    font-size: 14px; padding: 5px 10px;
  }
  .session-card-head select.topic-select{
    font-size: 16px; font-weight: 700; color: var(--ink);
    padding: 8px 10px;
  }
  .session-num-badge{
    font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px;
    flex: 0 0 auto; white-space: nowrap;
  }
  .field-row{ display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .field-row:last-child{ margin-bottom: 0; }
  .field-row label{ font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .field-row input[type=text], .field-row select{
    font: inherit; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--paper);
    color: var(--ink); width: 100%;
  }
  textarea.autogrow{
    font: inherit; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--paper);
    color: var(--ink); width: 100%; resize: none; overflow: hidden;
    min-height: 38px;
  }
  select.topic-select{
    flex: 1 1 auto; font: inherit; font-size: 13.5px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--paper-raised); color: var(--ink);
  }

  .topic-group{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .topic-group-title{ font-size: 14px; font-weight: 700; margin-bottom: 10px; }

  .item-row{
    display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
  }
  .item-row.drag-over{ border-color: var(--accent); background: var(--accent-soft); }
  .item-row.dragging{ opacity: .4; }
  .drag-handle{
    flex: 0 0 auto; width: 20px; height: 32px; display:flex; align-items:center; justify-content:center;
    cursor: grab; color: var(--ink-soft); font-size: 14px; user-select: none; touch-action: none;
  }
  .drag-handle:active{ cursor: grabbing; }
  .item-row input[type=text]{
    flex: 1 1 auto; font: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink);
  }
  .item-row textarea{
    flex: 1 1 auto; font: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink);
    resize: none; overflow: hidden; min-height: 32px;
  }
  .icon-btn{
    flex: 0 0 auto; width: 28px; height: 32px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--danger);
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  .icon-btn:hover{ border-color: var(--danger); background: var(--danger-soft); }
  .add-row-btn{
    font: inherit; font-size: 12px; font-weight: 600; color: var(--accent);
    background: none; border: 1px dashed var(--accent); border-radius: 7px;
    padding: 6px 10px; cursor: pointer; margin-top: 4px;
  }
  .add-row-btn:hover{ background: var(--accent-soft); }

  details.notes-details{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 20px;
  }
  details.notes-details summary{ font-size: 13px; font-weight: 700; cursor: pointer; }
  .topic-note-row{ margin-top: 12px; }
  .topic-note-row label{ font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; }
  .topic-note-row textarea{ min-height: 60px; }

  /* ---------- ③ 授業内容:2段階アコーディオン ---------- */
  .lecture-card{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
  }
  .lecture-head{
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  }
  .lecture-head .session-num-badge{
    font-size: 14px; padding: 5px 10px;
  }
  .lecture-head select.topic-select{
    font-size: 16px; font-weight: 700; color: var(--ink);
    padding: 8px 10px; border-color: var(--line);
  }
  .lecture-toggle{
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    cursor: pointer; font-size: 12px; margin-left: auto;
  }
  .lecture-toggle:hover{ border-color: var(--accent); }
  .lecture-body{ display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .lecture-card.open .lecture-body{ display: block; }
  .lecture-card.open .lecture-toggle{ color: var(--accent); border-color: var(--accent); }

  .group-block{
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 8px; overflow: hidden;
  }
  .group-block.drag-over{ border-color: var(--accent); }
  .group-block.dragging{ opacity: .4; }
  .group-head{ display: flex; align-items: center; gap: 6px; padding: 6px; }
  .group-head input[type=text]{
    flex: 1 1 auto; font: inherit; font-size: 13px; font-weight: 700; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink);
  }
  .group-count{
    flex: 0 0 auto; font-size: 10.5px; color: var(--ink-soft);
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
    white-space: nowrap;
  }
  .group-toggle{
    flex: 0 0 auto; width: 26px; height: 30px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
    cursor: pointer; font-size: 11px;
  }
  .group-toggle:hover{ border-color: var(--accent); }
  .group-body{ display: none; padding: 0 8px 8px 30px; }
  .group-block.open .group-body{ display: block; }
  .group-block.open .group-toggle{ color: var(--accent); border-color: var(--accent); }
  .child-row{
    display: flex; align-items: flex-start; gap: 6px; margin-top: 6px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 7px; padding: 6px;
  }
  .child-row.drag-over{ border-color: var(--accent); background: var(--accent-soft); }
  .child-row.dragging{ opacity: .4; }
  .child-row textarea{
    flex: 1 1 auto; font: inherit; font-size: 12.5px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
    resize: none; overflow: hidden; min-height: 30px;
  }
  .add-child-btn{
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--accent);
    background: none; border: 1px dashed var(--accent); border-radius: 6px;
    padding: 5px 9px; cursor: pointer; margin-top: 6px;
  }
  .add-child-btn:hover{ background: var(--accent-soft); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="btn" href="index.html">← 講義計画に戻る</a>
    <h1>講義計画・授業内容 編集ツール</h1>
    <span class="save-status" id="saveStatus"></span>
    <button class="btn" id="resetBtn">現在のサイト内容に戻す</button>
    <button class="btn" id="importBtn">JSON読み込み</button>
    <input type="file" id="importFile" accept="application/json">
    <button class="btn primary" id="exportBtn">JSON書き出し</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-view="view-sessions">① 講義計画(15コマ)</button>
  <button class="tab-btn" data-view="view-checklists">② 理解度チェック</button>
  <button class="tab-btn" data-view="view-outline">③ 授業内容(講義1-15)</button>
  <button class="tab-btn" data-view="view-topics">④ 疾患一覧</button>
</div>

<div class="wrap">

  <div class="view active" id="view-sessions">
    <div id="sessionsList"></div>
  </div>

  <div class="view" id="view-checklists">
    <div id="checklistsList"></div>
  </div>

  <div class="view" id="view-outline">
    <div id="outlineList"></div>
    <details class="notes-details">
      <summary>疾患ごとの共通メモ(POINTなど・任意)</summary>
      <div id="topicNotesList"></div>
    </details>
  </div>

  <div class="view" id="view-topics">
    <div class="note-box">
      疾患・項目の名称はここで自由に変更できます。「+ 疾患を追加」で新しい項目を増やせます。削除は、①③でその疾患が使われていない場合のみ可能です(使われている場合は、先に他の疾患へ変更してから削除してください)。
    </div>
    <div id="topicsList"></div>
    <button class="add-row-btn" id="addTopicBtn">+ 疾患を追加</button>
  </div>

</div>

  var STORAGE_KEY = 'neuro-pt-editor-draft-v3';

  function migrateLectureItems(items){
    // v2互換: フラットな{type,text}配列を{text,children}構造に変換
    if(!items || items.length === 0) return [];
    if(items[0] && items[0].hasOwnProperty('children')) return items;
    var groups = [];
    items.forEach(function(it){
      if(it.type === 'sub'){
        if(groups.length === 0){ groups.push({text: '(見出しなし)', children: []}); }
        groups[groups.length - 1].children.push(it.text);
      } else {
        groups.push({text: it.text, children: []});
      }
    });
    return groups;
  }

  function migrateState(data){
    if(data && data.lectures){
      data.lectures.forEach(function(lec){
        lec.items = migrateLectureItems(lec.items);
      });
    }
    return data;
  }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return migrateState(JSON.parse(raw));
    } catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  var state = loadState();
  var saveTimer = null;

  function persist(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      var el = document.getElementById('saveStatus');
      el.textContent = '保存済み ' + new Date().toLocaleTimeString('ja-JP');
    } catch(e){}
  }
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function topicOptions(selectedId){
    return state.topics.map(function(t){
      return '<option value="' + t.id + '"' + (t.id === selectedId ? ' selected' : '') + '>' + t.name + '</option>';
    }).join('');
  }
  function topicName(id){
    var t = state.topics.filter(function(x){ return x.id === id; })[0];
    return t ? t.name : id;
  }

  function escapeAttr(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  /* ---------- 汎用ドラッグ並び替え ---------- */
  function enableDragReorder(container, array, itemSelector, onChange){
    var dragIndex = null;
    container.querySelectorAll(itemSelector).forEach(function(row){
      row.addEventListener('dragstart', function(ev){
        ev.stopPropagation();
        dragIndex = parseInt(row.dataset.index, 10);
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', function(ev){
        ev.stopPropagation();
        row.classList.remove('dragging');
        container.querySelectorAll(itemSelector).forEach(function(r){ r.classList.remove('drag-over'); });
      });
      row.addEventListener('dragover', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', function(ev){
        ev.stopPropagation();
        row.classList.remove('drag-over');
      });
      row.addEventListener('drop', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        row.classList.remove('drag-over');
        var dropIndex = parseInt(row.dataset.index, 10);
        if(dragIndex === null || dragIndex === dropIndex) return;
        var moved = array.splice(dragIndex, 1)[0];
        array.splice(dropIndex, 0, moved);
        dragIndex = null;
        onChange();
      });
    });
  }

    var a = document.createElement('a');
    var ts = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'neuro-pt-content-' + ts + '.json';

    var reader = new FileReader();
    reader.onload = function(){
      try {
        var text = reader.result.replace(/^\ufeff/, '');
        var parsed = migrateState(JSON.parse(text));
        state = parsed;
        persist();
        renderAll();
        alert('読み込みました。');
      } catch(err){
        alert('JSONの読み込みに失敗しました。ファイルを確認してください。');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('現在の編集内容を破棄して、サイトの現在の内容に戻します。よろしいですか?')) return;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    persist();
    renderAll();
  });

  persist();
</script>
